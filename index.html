<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172554">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habita">
<title>Habita</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f7f9fc;--card:#fff;--ink:#172554;--mut:#69758b;--line:#e4e9f2;--soft:#edf3ff;--blue:#2563eb;--amb:#fff4df;--ambt:#986013;--grn:#e5f6ec;--grnt:#14723f;--red:#fdeaea;--redt:#a32626;--navy:#172554;color-scheme:light only}
*{box-sizing:border-box}
html{background:#f7f9fc}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;padding:0 24px 28px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 24px 6px}
.logo{font-size:26px;font-weight:700;letter-spacing:-.5px}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;position:relative}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.eb{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;margin:14px 0 6px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;letter-spacing:-.6px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}
.navy{background:var(--navy);color:#fff;border-color:var(--navy)}.navy .mut{color:#c7d2ee}
.mut{color:var(--mut)}
.big{font-size:36px;font-weight:700;letter-spacing:-1px;margin:12px 0 6px}
.mid{font-size:28px;font-weight:700;letter-spacing:-.8px;margin:6px 0}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--amb);color:var(--ambt);white-space:nowrap}
.pill.g{background:var(--grn);color:var(--grnt)}.pill.b{background:var(--soft);color:var(--blue)}.pill.r{background:var(--red);color:var(--redt)}
label.pill{cursor:pointer}
.btn{display:flex;justify-content:center;align-items:center;width:100%;padding:15px;border-radius:14px;font-weight:600;background:var(--blue);color:#fff;margin-top:14px;text-align:center}
.btn.o{background:none;border:1.5px solid var(--line);color:var(--ink)}.btn.t{background:none;color:var(--blue)}.btn.d{background:var(--red);color:var(--redt)}
.btn:disabled{opacity:.6}
.sec{font-size:19px;font-weight:700;margin:22px 0 10px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ic{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--blue);display:grid;place-items:center;font-size:20px;flex:none}
.rc{flex:1;min-width:0}.rc b{display:block}.rc small{color:var(--mut);font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px}.kv span{color:var(--mut)}.kv b{text-align:right}
.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.f{margin-bottom:14px}.f label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:50px}
.f textarea{min-height:100px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;font-size:13px;color:var(--mut);margin:8px 0 4px;align-items:flex-start}.chk input{margin-top:3px}
.hero{background:var(--navy);color:#fff;border-radius:0 0 32px 32px;margin:0 -24px;padding:calc(40px + env(safe-area-inset-top,0px)) 24px 36px;min-height:54dvh;display:flex;flex-direction:column;justify-content:flex-end}
.hero h1{font-size:40px}.hero p{color:#c7d2ee}
.pb{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 6px}.pb i{display:block;height:100%;background:var(--blue);border-radius:99px}
.al{display:flex;gap:12px;align-items:flex-start;width:100%;background:var(--amb);color:var(--ambt);border-radius:16px;padding:14px;margin-bottom:16px;font-size:14px}.al svg{font-size:22px;margin-top:2px}
.nt{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.nt:first-child{border-top:0}.nt b{display:block}.nt small{color:var(--mut)}
.un{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:7px;flex:none}
.ph{width:100%;border-radius:14px;margin:6px 0;display:block}
.av{width:66px;height:66px;border-radius:50%;background:var(--soft);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:22px;flex:none}
.note{font-size:13px;color:var(--mut);text-align:center;margin:12px 0}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
nav{position:sticky;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:10px 8px calc(14px + env(safe-area-inset-bottom,0px))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);padding:4px 12px;font-weight:500}nav svg{font-size:23px}nav .on{color:var(--blue);font-weight:700}
.tip{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:14px;padding:12px 18px;border-radius:16px;z-index:9;max-width:92vw;text-align:center}
.load{padding:80px 20px;text-align:center;color:var(--mut)}
a.btn{text-decoration:none}
@media print{.bar,nav,.btn,.tip{display:none!important}body{background:#fff;color:#000}.card{border:1px solid #999;break-inside:avoid}}
</style>
</head>
<body>
<div id="app"><div class="load">Cargando Habita…</div></div>
<script type="module" src="app.js"></script>

</body>
</html>
